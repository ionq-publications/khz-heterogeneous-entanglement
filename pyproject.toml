[project]
name = "khz-heterogeneous-entanglement"
version = "0.0.1"
requires-python = ">=3.10"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "xarray==2025.6.1",
    "h5netcdf==1.8.1",
    "pandas==2.3.3",
    "matplotlib==3.10.8",
    "lmfit==1.3.4",
    "jupyterlab==4.5.6",
    "jupytext==1.19.1",
    "h5py==3.16.0",
    "ruff==0.15.7",
    "cvxpy==1.7.5",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papertools", "src/analysis"]

[tool.ruff.lint]
extend-select = ["I"]
